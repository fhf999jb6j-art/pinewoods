<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pinewood Extract</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Saira+Stencil+One&display=swap"><style>
/* Layout: full-bleed canvas game, HUD pinned to the corners, code workbench as a right-hand drawer. Single dark look by design. */
:root{
  --bg:#10140d; --panel:#171c13; --panel2:#1f2619; --line:#36412b; --ink:#ebe5d2; --muted:#a4a990; --dim:#6e765f;
  --amber:#e3a63a; --amber-ink:#1b1404; --ok:#86c25b; --bad:#e0593d; --gold:#f2cf5b; --code:#0b0e09; --sel:#3a4a2a;
  --f-display:'Saira Stencil One','Barlow Condensed',Impact,sans-serif;
  --f-hud:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#app{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;outline:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.9em;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:rgba(0,0,0,.25)}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:absolute;pointer-events:none;font-family:var(--f-hud);letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#hudTL{top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;max-width:min(380px,58vw)}
.hp-row{display:flex;align-items:center;gap:10px}
.hp-label{font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.14em}
.hp-frame{width:220px;height:16px;background:rgba(0,0,0,.55);border:1px solid rgba(235,229,210,.4);position:relative}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok)}
#hpNum{font-weight:700;font-size:19px;min-width:3ch}
.offline{font-family:var(--f-body);font-size:12px;color:var(--amber);background:rgba(0,0,0,.5);padding:3px 7px;border-radius:4px;text-shadow:none;align-self:flex-start}
.stat{font-size:18px;display:flex;gap:8px;align-items:baseline;font-weight:600}
.stat .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat.buff{color:var(--gold);font-size:15px}
#tracker{display:flex;flex-direction:column;gap:3px;margin-top:4px}
#tracker .tr{font-size:15px;color:var(--ink);display:flex;gap:8px}
#tracker .tr b{color:var(--amber);font-weight:700}
#tracker .tr.head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hudTop{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#locName{font-family:var(--f-display);font-size:22px;letter-spacing:.1em;color:var(--ink)}
#locSub{font-size:15px;color:var(--muted)}
#previewTag{display:inline-block;margin-top:4px;font-size:12px;letter-spacing:.12em;background:var(--gold);color:#1b1404;padding:1px 8px;border-radius:3px;text-shadow:none;font-weight:700}
#hudTR{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:6}
#app.coding #hudTR,#app.coding #hudBR{right:calc(var(--pw,0px) + 16px)}
#app.coding #hudTop,#app.coding #hudBC{display:none}
.tbtn{font-family:var(--f-hud);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:rgba(14,18,11,.86);color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;position:relative}
.tbtn:hover{border-color:var(--amber)}
.tbtn.code{font-family:var(--f-mono);color:var(--amber);font-size:17px;letter-spacing:0;padding:7px 13px}
.tbtn.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
#codeBadge{position:absolute;top:-8px;right:-8px;background:var(--bad);color:#fff;font:700 11px/18px var(--f-mono);border-radius:999px;min-width:18px;height:18px;text-align:center;padding:0 5px}
#codeBadge:empty{display:none}
#prompt{left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,13,8,.82);border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:18px;font-weight:600;text-shadow:none;white-space:nowrap}
#prompt kbd{font-size:13px;color:var(--amber);border-color:var(--amber);margin-right:6px}
#prompt.lock{color:var(--amber);font-family:var(--f-body);font-size:14px}
#extractBox{left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center;width:260px}
#extractText{font-size:18px;font-weight:700;color:var(--ok);letter-spacing:.06em}
.bar{height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(235,229,210,.25);margin-top:5px}
.bar > div{height:100%;width:0;background:var(--ok)}
.bar.thin{height:4px}
.bar.thin > div{background:var(--amber)}
#hudBC{left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
#medBar{display:flex;gap:6px}
.med{background:rgba(10,13,8,.8);border:1px solid var(--line);border-radius:5px;padding:4px 9px;min-width:84px;text-shadow:none}
.med .mk{font-family:var(--f-mono);font-size:11px;color:var(--amber)}
.med .mn{font-size:14px;font-weight:600;display:block}
.med .mc{font-size:13px;color:var(--muted)}
.med.empty{opacity:.4}
#hudBR{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end}
.wcol{text-align:right;min-width:170px}
#magCv{width:64px;height:96px;display:block}
#wName{font-size:20px;font-weight:700;letter-spacing:.04em}
#wAmmo{font-size:30px;font-weight:700;line-height:1}
#wAmmo small{font-size:17px;color:var(--muted);font-weight:600}
#wSlots{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;font-size:13px;color:var(--muted)}
#wSlots .on{color:var(--amber)}
#toasts{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(380px,45vw);z-index:7}
.toast{background:rgba(10,13,8,.88);border-left:3px solid var(--amber);padding:7px 11px;font-size:14px;border-radius:0 5px 5px 0;animation:tin .18s ease-out}
.toast.good{border-color:var(--ok)}
.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateX(-10px);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,30,20,.55));opacity:0}

#stamWrap{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:200px}
#stamWrap .k{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
#stamBar{height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(235,229,210,.3);margin-top:4px;position:relative}
#stamFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#7fb6d9}
#stamWrap.winded #stamFill{background:var(--bad)}
#stamOff{font-family:var(--f-body);font-size:12px;color:var(--amber);background:rgba(0,0,0,.5);padding:3px 7px;border-radius:4px;text-shadow:none;margin-top:4px}
#healBox{left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:240px;text-align:center}
#healText{font-size:16px;font-weight:700;color:var(--ok)}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.inv > div{min-width:0}
.col-h{font-family:var(--f-hud);font-size:20px;font-weight:700;letter-spacing:.06em;margin:0;color:var(--ink);text-transform:uppercase}
.buy.sm{padding:5px 10px;font-size:14px}
.durbar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;overflow:hidden}
.durbar div{height:100%;background:#7fb6d9}
@media (max-width:640px){.inv{grid-template-columns:1fr}}

.menu-btns{display:flex;flex-direction:column;gap:8px}
.menu-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.menu-btn:hover{border-color:var(--amber);background:rgba(227,166,58,.06)}
.menu-btn b{font-family:var(--f-hud);font-size:22px;font-weight:700;letter-spacing:.04em}
.menu-btn span{font-size:13px;color:var(--muted)}
.menu-btn.danger b{color:var(--bad)}
.session{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-hud);font-size:16px;color:var(--muted);margin:0 0 14px}
.session b{color:var(--ink);font-weight:700}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:minmax(0,200px) 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(255,255,255,.02)}
.slot img,.shot-empty{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:#0b0e09;display:block}
.shot-empty{display:grid;place-items:center;font-family:var(--f-hud);font-size:14px;letter-spacing:.14em;color:var(--dim)}
.slot .info{min-width:0}
.sl-stats{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 0;font-size:13px}
.sl-stats dt{color:var(--muted);font-family:var(--f-hud);letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding-top:1px}
.sl-stats dd{margin:0;font-variant-numeric:tabular-nums}
.back{margin-bottom:12px}
@media (max-width:560px){.slot{grid-template-columns:1fr}}
.tbtn svg{width:18px;height:18px;display:block}

/* Map */
#mapOverlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,4,.55);z-index:12;padding:16px}
.map-card{background:#1c2117;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:100%}
.map-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-hud);font-size:18px;font-weight:700;letter-spacing:.06em}
#mapCanvas{display:block;border-radius:4px;max-width:100%}
#mapNote{font-size:14px;color:var(--muted)}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.x:hover{color:var(--ink);border-color:var(--amber)}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(5,7,4,.66);display:grid;place-items:center;z-index:20;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.modal-card.wide{width:min(900px,100%)}
.m-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.m-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.06em;flex:1;text-wrap:balance}
.cash{font-family:var(--f-hud);font-size:22px;font-weight:700;color:var(--gold)}
.m-sec{margin-top:14px}
.m-sec h3{font-family:var(--f-hud);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.r-main{flex:1;min-width:0}
.r-name{font-family:var(--f-hud);font-size:19px;font-weight:700}
.r-desc{font-size:13px;color:var(--muted)}
.r-own{font-size:13px;color:var(--muted);font-family:var(--f-hud);letter-spacing:.06em}
.buy,.primary{background:var(--amber);color:var(--amber-ink);border:0;border-radius:6px;padding:8px 14px;font-family:var(--f-hud);font-weight:700;font-size:16px;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.buy:disabled{background:#3a3f30;color:#7c826c;cursor:not-allowed}
.buy:not(:disabled):hover,.primary:hover{filter:brightness(1.08)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.ghost:hover{border-color:var(--amber)}
.locked{font-size:14px;color:var(--amber);padding:10px 12px;background:rgba(227,166,58,.08);border:1px dashed rgba(227,166,58,.4);border-radius:6px}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden}
.prog div{height:100%;background:var(--amber)}
.reward{font-family:var(--f-hud);font-size:20px;font-weight:700;color:var(--gold)}
.m-text{font-size:15px;line-height:1.55;color:var(--ink);max-width:62ch}
.m-text p{margin:0 0 10px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:10px 0 4px}
.keys span:nth-child(odd){font-family:var(--f-mono);font-size:12px;color:var(--amber);white-space:nowrap}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.title-big{font-family:var(--f-display);font-size:44px;letter-spacing:.06em;line-height:1;margin:0 0 4px}
.eyebrow{font-family:var(--f-hud);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:600}
textarea.paste{width:100%;min-height:220px;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12.5px/1.5 var(--f-mono);padding:10px;resize:vertical}

/* Code workbench */
#code{position:absolute;top:0;right:0;bottom:0;width:min(100vw,clamp(380px,44vw,660px));background:var(--panel);border-left:1px solid var(--line);z-index:15;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.cp-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cp-title{font-family:var(--f-hud);font-size:20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1}
.cp-title .lt{font-family:var(--f-mono);color:var(--amber);margin-right:8px;letter-spacing:0}
.cp-prog{font-family:var(--f-hud);font-size:15px;color:var(--muted)}
.cp-scroll{flex:1;overflow:auto;padding:14px 16px 18px;overscroll-behavior:contain}
.cp-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel2)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-right:auto}
.chk input{accent-color:var(--amber)}
.cp-intro{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 12px;max-width:62ch}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:7px;padding:10px 12px;cursor:pointer}
.task:hover{border-color:var(--line);background:rgba(255,255,255,.045)}
.t-n{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.t-main{min-width:0}
.t-name{font-family:var(--f-hud);font-size:19px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t-name .fn{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.t-unlock{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.chip{font-family:var(--f-hud);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.live{border-color:var(--amber);color:var(--amber)}
.chip.error,.chip.paused{border-color:var(--bad);color:var(--bad)}
.chip.done{background:var(--ok);border-color:var(--ok);color:#10200a}
.chip.star{background:var(--gold);border-color:var(--gold);color:#241a02}
.dt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dt-num{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.tag{font-family:var(--f-hud);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.dt h2{font-family:var(--f-hud);font-size:30px;font-weight:700;margin:6px 0 4px;letter-spacing:.02em}
.unlock{font-size:14px;margin:0 0 10px;color:var(--ink);line-height:1.45}
.unlock b{font-family:var(--f-hud);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--ok);margin-right:6px}
.explain{font-size:14.5px;line-height:1.6;max-width:62ch}
.explain p{margin:0 0 9px}
table.mini{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;margin:4px 0 10px}
table.mini th,table.mini td{border:1px solid var(--line);padding:4px 12px;text-align:center}
table.mini th{color:var(--muted);font-weight:400}
.editor-wrap{display:flex;background:var(--code);border:1px solid var(--line);border-radius:8px;margin:12px 0 8px;overflow:hidden}
.editor-wrap:focus-within{border-color:var(--amber)}
.gutter{font:13px/1.6 var(--f-mono);color:#4b5440;text-align:right;padding:12px 8px 12px 10px;user-select:none;white-space:pre;border-right:1px solid rgba(255,255,255,.05);min-width:38px}
#editor{flex:1;min-width:0;background:transparent;color:#e8e2cc;border:0;outline:none;resize:none;font:13px/1.6 var(--f-mono);padding:12px;white-space:pre;overflow-x:auto;overflow-y:hidden;tab-size:2;caret-color:var(--amber)}
#editor::selection{background:var(--sel)}
.ed-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-actions .chk{margin-right:0}
.ed-actions .spacer{flex:1}
.errbox{margin-top:10px;background:rgba(224,89,61,.1);border:1px solid rgba(224,89,61,.45);color:#f2b3a3;border-radius:6px;padding:9px 11px;font:12.5px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tests{margin-top:14px}
.t-head{display:flex;justify-content:space-between;font-family:var(--f-hud);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.t{display:grid;grid-template-columns:20px 1fr;gap:4px 8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:13px}
.t .ic{font-weight:700;font-family:var(--f-mono)}
.t.pass .ic{color:var(--ok)}
.t.fail .ic{color:var(--bad)}
.t.bonus.pass .ic{color:var(--gold)}
.t .call{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.t .call .note{font-family:var(--f-body);color:var(--muted);font-size:12.5px;margin-left:6px}
.t .vals{grid-column:2;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.t.fail .vals .got{color:#f2b3a3}
.bonus-intro{margin-top:16px;padding:10px 12px;border:1px solid rgba(242,207,91,.3);border-radius:7px;background:rgba(242,207,91,.05);font-size:13.5px;line-height:1.5}
.bonus-intro b{font-family:var(--f-hud);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.helpbox{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.hint{font-size:13.5px;line-height:1.5;padding:9px 12px;border-left:3px solid var(--amber);background:rgba(227,166,58,.06);border-radius:0 6px 6px 0}
.help-row{display:flex;gap:8px;flex-wrap:wrap}

const isNum = v => typeof v === 'number' && isFinite(v);
const VALID = {
  num: isNum, angle: isNum, bool: v => typeof v === 'boolean',
  xy: v => !!v && typeof v === 'object' && isNum(v.x) && isNum(v.y),
  vel: v => !!v && typeof v === 'object' && isNum(v.vx) && isNum(v.vy),
};
function close(a,b){ return isNum(a) && Math.abs(a-b) < 0.01; }
function sameVal(kind, got, exp){
  if(kind==='num') return close(got,exp);
  if(kind==='angle') return isNum(got) && Math.abs(Math.atan2(Math.sin(got-exp),Math.cos(got-exp))) < 0.01;
  if(kind==='bool') return got===exp;
  if(kind==='xy') return VALID.xy(got) && close(got.x,exp.x) && close(got.y,exp.y);
  if(kind==='vel') return VALID.vel(got) && close(got.vx,exp.vx) && close(got.vy,exp.vy);
  return false;
}
function runOne(ex, fn, t, bonus){
  let got, err=null, pass=false;
  try { got = fn.apply(null, t.args); } catch(e){ err = (e && e.message) || String(e); }
  if(!err){ try { pass = t.check ? !!t.check(got, fn) : sameVal(ex.kind, got, t.expect); } catch(e){ err=(e&&e.message)||String(e); } }
  return { t, bonus, got, err, pass };
}
function runTests(ex, fn){
  return ex.tests.map(t=>runOne(ex,fn,t,false)).concat((ex.bonus||[]).map(t=>runOne(ex,fn,t,true)));
}

const EXMAP = Object.fromEntries(EX.map(e=>[e.id,e]));
const compiled = {}, status = {}, SOL = {};
let codes = {}, preview = false, autoRun = true;
const KEY='pinewood-extract-v1', RUNKEY='pinewood-extract-running';

function makeFactory(params, body){
  try { return new Function(...params, body); }
  catch(e){
    if(e instanceof SyntaxError) throw e;
  }
  // Fallback for pages that block eval: run it as a script tag.
  let err=null;
  const h=ev=>{ err = ev.error || new SyntaxError(ev.message); ev.preventDefault(); };
  window.addEventListener('error', h);
  window.__pwFactory = null;
  const s=document.createElement('script');
  s.textContent='window.__pwFactory=function('+params.join(',')+'){'+body+'\n};';
  document.head.appendChild(s); s.remove();
  window.removeEventListener('error', h);
  if(err) throw err;
  if(!window.__pwFactory) throw new Error('This browser blocked running your code.');
  return window.__pwFactory;
}
function helperCall(id, args){
  const fn = preview ? SOL[id] : compiled[id];
  if(!fn) throw new Error(id+'() isn\'t working yet. Finish it first, or do the math right here instead.');
  return fn.apply(null, args);
}
function compileCode(ex, code){
  const others = EX.filter(e=>e.id!==ex.id).map(e=>e.id);
  const body = '"use strict";\n' + code + '\n;return (typeof '+ex.id+' === "function") ? '+ex.id+' : null;';
  const factory = makeFactory(others, body);
  const fn = factory(...others.map(id => (...a) => helperCall(id, a)));
  if(typeof fn!=='function') throw new Error('Can\'t find "function '+ex.id+'(...)". Keep the first line the same so the game can find it.');
  return fn;
}
const norm = s => String(s||'').replace(/\s+/g,'');
function evaluate(id){
  const ex=EXMAP[id], code=codes[id];
  const st = status[id] || (status[id]={});
  st.runErr=null;
  const isStarter = norm(code)===norm(ex.starter);
  let fn;
  try { fn = compileCode(ex, code); }
  catch(e){ st.state='error'; st.err=(e.name==='SyntaxError'?'Typo: ':'')+(e.message||String(e)); return st; }
  try{ localStorage.setItem(RUNKEY, id); }catch(e){}
  const results = runTests(ex, fn);
  try{ localStorage.removeItem(RUNKEY); }catch(e){}
  compiled[id]=fn; st.err=null; st.results=results;
  const req=results.filter(r=>!r.bonus), bon=results.filter(r=>r.bonus);
  st.pass=req.filter(r=>r.pass).length; st.total=req.length;
  const allReq=req.every(r=>r.pass);
  st.state = allReq ? (bon.length && bon.every(r=>r.pass) ? 'star' : 'done') : (isStarter ? 'todo' : 'live');
  return st;
}
function runtimeFail(id, e){
  compiled[id]=null;
  const st=status[id]||(status[id]={});
  st.state='error';
  st.err='Crashed while the game was running: '+((e&&e.message)||String(e))+'\nThe feature is switched off until you press Run again.';
  toast(id+'() crashed. Open </> to see why.','bad');
  refreshPanel();
}
// Call a student function from the game. Returns null if it isn't usable.
function F(id, ...args){
  const fn = preview ? SOL[id] : compiled[id];
  if(!fn) return null;
  let r;
  try { r = fn.apply(null, args); } catch(e){ if(!preview) runtimeFail(id, e); return null; }
  return VALID[EXMAP[id].kind](r) ? r : null;
}
function isDone(id){ const s=status[id]; return s && (s.state==='done'||s.state==='star'); }

  const t=12,g=58,W=[],mx=h.x+h.w/2,my=h.y+h.h/2;
  const horiz=(y,door)=>{ if(door){ W.push({x:h.x,y,w:mx-g/2-h.x,h:t},{x:mx+g/2,y,w:h.x+h.w-(mx+g/2),h:t}); } else W.push({x:h.x,y,w:h.w,h:t}); };
  const vert=(x,door)=>{ if(door){ W.push({x,y:h.y,w:t,h:my-g/2-h.y},{x,y:my+g/2,w:t,h:h.y+h.h-(my+g/2)}); } else W.push({x,y:h.y,w:t,h:h.h}); };
  horiz(h.y,h.door==='n'); horiz(h.y+h.h-t,h.door==='s'); vert(h.x,h.door==='w'); vert(h.x+h.w-t,h.door==='e');
  // a bit of furniture as cover
  W.push({x:h.x+h.w*0.62,y:h.y+h.h*0.3,w:34,h:22});
  return W;
}
const RAID_WALLS=HOUSES.flatMap(houseWalls);
function distSeg(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy; let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; t=clamp(t,0,1); return hyp(px-(ax+dx*t),py-(ay+dy*t)); }
function roadDist(x,y){ let best=1e9, w=0; for(const r of ROADS){ for(let i=0;i<r.pts.length-1;i++){ const d=distSeg(x,y,r.pts[i][0],r.pts[i][1],r.pts[i+1][0],r.pts[i+1][1])-r.w/2; if(d<best){best=d;w=r.w;} } } return best; }
const TREES=[]; const TGRID=new Map(); const CELL=160;
function gridKey(cx,cy){ return cx+','+cy; }
function nearTrees(x,y){ const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL),out=[]; for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){ const a=TGRID.get(gridKey(cx+i,cy+j)); if(a) for(const t of a) out.push(t);} return out; }
function inHouse(x,y,pad){ for(const h of HOUSES){ if(x>h.x-pad&&x<h.x+h.w+pad&&y>h.y-pad&&y<h.y+h.h+pad) return h; } return null; }
(function genTrees(){
  const R=mulberry32(4242);
  const C1=['#2d4826','#34522a','#284021','#3a582c','#30491f'], C2=['#3f6330','#486e36','#3a5b2b','#4f7638','#43642c'];
  const tryTree=(x,y)=>{
    const r=16+R()*20, tr=r*0.38;
    if(x<30||y<30||x>WORLD.w-30||y>WORLD.h-30) return;
    if(roadDist(x,y)<tr+14) return;
    if(inHouse(x,y,36)) return;
    for(const e of EXTRACTS) if(hyp(e.x-x,e.y-y)<e.r+50) return;
    for(const s of SPAWNS) if(hyp(s.x-x,s.y-y)<90) return;
    for(const t of nearTrees(x,y)) if(hyp(t.x-x,t.y-y)<t.tr+tr+18) return;
    const k=Math.floor(R()*C1.length);
    const t={x,y,r,tr,c1:C1[k],c2:C2[k],pine:R()<0.35};
    TREES.push(t);
    const key=gridKey(Math.floor(x/CELL),Math.floor(y/CELL));
    if(!TGRID.has(key)) TGRID.set(key,[]);
    TGRID.get(key).push(t);
  };
  for(let c=0;c<24;c++){
    const cx=R()*WORLD.w, cy=R()*WORLD.h, n=10+Math.floor(R()*20), sp=140+R()*170;
    for(let i=0;i<n*2;i++) tryTree(cx+(R()+R()-1)*sp, cy+(R()+R()-1)*sp);
  }
  for(let i=0;i<160;i++) tryTree(R()*WORLD.w,R()*WORLD.h);
})();
let groundCanvas=null;
function buildGround(){
  const S=0.5, g=document.createElement('canvas'); g.width=WORLD.w*S; g.height=WORLD.h*S;
  const c=g.getContext('2d'); c.scale(S,S);
  const R=mulberry32(99);
  c.fillStyle='#2b3a23'; c.fillRect(0,0,WORLD.w,WORLD.h);
  const blot=['#33452a','#27361f','#3a4b2c','#2f3f25','#3d4a2e','#353f27'];
  for(let i=0;i<1100;i++){ c.globalAlpha=0.35+R()*0.3; c.fillStyle=blot[Math.floor(R()*blot.length)]; c.beginPath(); c.ellipse(R()*WORLD.w,R()*WORLD.h,20+R()*130,15+R()*90,R()*TAU,0,TAU); c.fill(); }
  c.globalAlpha=1;
  // forest floor and tree shadows
  for(const t of TREES){ c.fillStyle='rgba(16,24,12,0.22)'; c.beginPath(); c.arc(t.x,t.y,t.r*2,0,TAU); c.fill(); }
  for(const t of TREES){ c.fillStyle='rgba(0,0,0,0.28)'; c.beginPath(); c.ellipse(t.x+7,t.y+9,t.r,t.r*0.9,0,0,TAU); c.fill(); }
  // grass flecks
  c.strokeStyle='rgba(120,140,80,0.25)'; c.lineWidth=2;
  for(let i=0;i<2500;i++){ const x=R()*WORLD.w,y=R()*WORLD.h; c.beginPath(); c.moveTo(x,y); c.lineTo(x+R()*6-3,y-4-R()*6); c.stroke(); }
  // roads
  c.lineJoin='round'; c.lineCap='round';
  for(const r of ROADS){ const path=()=>{ c.beginPath(); r.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); };
    path(); c.strokeStyle=r.paved?'#3f3d33':'#4a3f2c'; c.lineWidth=r.w+12; c.stroke();
    path(); c.strokeStyle=r.paved?'#5f5c4c':'#6d5c3f'; c.lineWidth=r.w; c.stroke();
    if(r.paved){ path(); c.setLineDash([34,46]); c.strokeStyle='rgba(200,185,120,0.45)'; c.lineWidth=3; c.stroke(); c.setLineDash([]); }
    else { path(); c.strokeStyle='rgba(40,30,18,0.35)'; c.lineWidth=r.w*0.55; c.stroke(); path(); c.strokeStyle='#6d5c3f'; c.lineWidth=r.w*0.3; c.stroke(); }
  }
  // house footprints
  for(const h of HOUSES){ c.fillStyle='rgba(0,0,0,0.35)'; c.fillRect(h.x-6,h.y-4,h.w+16,h.h+16); c.fillStyle='#4a3d2d'; c.fillRect(h.x,h.y,h.w,h.h);
    c.strokeStyle='rgba(0,0,0,0.18)'; c.lineWidth=2; for(let y=h.y+14;y<h.y+h.h;y+=14){ c.beginPath(); c.moveTo(h.x,y); c.lineTo(h.x+h.w,y); c.stroke(); } }
  groundCanvas=g;
}

function genMission(){
  const have=new Set((G.missions||[]).map(m=>m.key));
  const pool=[
    {key:'k5',type:'kills',target:5,reward:4000,text:'Kill 5 hostiles'},
    {key:'s3',type:'scavs',target:3,reward:3500,text:'Take out 3 armed scavs'},
    {key:'d3',type:'dogs',target:3,reward:3000,text:'Put down 3 attack dogs'},
    {key:'g2',type:'guns',target:2,reward:3200,text:'Bring 2 weapons back from the woods'},
    {key:'k12',type:'kills',target:12,reward:11000,text:'Kill 12 hostiles'},
    {key:'v',type:'visit',target:1,reward:2800},
  ].filter(m=>!have.has(m.key));
  const m={...pick(pool), prog:0};
  if(m.type==='visit'){ m.house=Math.floor(Math.random()*HOUSES.length); m.text='Search the '+HOUSES[m.house].name+' and extract'; }
  return m;
}
function raidGain(m){
  if(!raid) return 0;
  const s=raid.stats;
  if(m.type==='kills') return s.kills;
  if(m.type==='scavs') return s.scavs;
  if(m.type==='dogs') return s.dogs;
  if(m.type==='guns') return s.guns;
  if(m.type==='visit') return s.visited.has(m.house)?1:0;
  return 0;
}

const toastsEl=$('#toasts'); const toastSeen={};
function toast(msg, kind){
  const d=document.createElement('div'); d.className='toast'+(kind?' '+kind:''); d.textContent=msg; toastsEl.appendChild(d);
  while(toastsEl.children.length>5) toastsEl.firstChild.remove();
  setTimeout(()=>d.remove(), 3600);
}

/* ================= COLLISION ================= */
function curWalls(){ return scene==='raid'?RAID_WALLS:SAFE_WALLS; }
function pushOutRect(e,r){
  const cx=clamp(e.x,r.x,r.x+r.w), cy=clamp(e.y,r.y,r.y+r.h);
  const dx=e.x-cx, dy=e.y-cy, d2=dx*dx+dy*dy;
  if(d2>=e.r*e.r) return;
  if(d2>0.0001){ const d=Math.sqrt(d2); e.x=cx+dx/d*e.r; e.y=cy+dy/d*e.r; }
  else { const l=e.x-r.x, rt=r.x+r.w-e.x, t=e.y-r.y, b=r.y+r.h-e.y, m=Math.min(l,rt,t,b);
    if(m===l) e.x=r.x-e.r; else if(m===rt) e.x=r.x+r.w+e.r; else if(m===t) e.y=r.y-e.r; else e.y=r.y+r.h+e.r; }
}
function resolve(e){
  const W=scene==='raid'?WORLD:SAFE;
  for(const r of curWalls()) pushOutRect(e,r);
  if(scene==='raid'){ for(const t of nearTrees(e.x,e.y)){ const dx=e.x-t.x, dy=e.y-t.y, d=hyp(dx,dy), m=e.r+t.tr; if(d<m&&d>0.001){ e.x=t.x+dx/d*m; e.y=t.y+dy/d*m; } } }
  e.x=clamp(e.x,e.r,W.w-e.r); e.y=clamp(e.y,e.r,W.h-e.r);
}
function hitsWall(x,y){
  for(const r of curWalls()) if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h) return true;
  if(scene==='raid'){ for(const t of nearTrees(x,y)) if(hyp(x-t.x,y-t.y)<t.tr) return true; }
  return false;
}

/* ================= RAID ================= */
function freeSpot(minFromPlayer){
  for(let i=0;i<200;i++){
    const near=Math.random()<0.45?pick(HOUSES):null;
    const x=near?near.x+near.w/2+rr(-220,220):rr(80,WORLD.w-80), y=near?near.y+near.h/2+rr(-220,220):rr(80,WORLD.h-80);
    if(x<60||y<60||x>WORLD.w-60||y>WORLD.h-60) continue;
    if(hyp(x-P.x,y-P.y)<minFromPlayer) continue;
    if(RAID_WALLS.some(r=>x>r.x-20&&x<r.x+r.w+20&&y>r.y-20&&y<r.y+r.h+20)) continue;
    if(nearTrees(x,y).some(t=>hyp(t.x-x,t.y-y)<t.tr+20)) continue;
    return {x,y};
  }
  return {x:rr(100,3100),y:rr(100,3100)};
}

function doExtract(){
  raid.over=true;
  G.cash+=raid.cash;
  const pk=raid.pack, sent=[];
  for(const t in pk.ammo){ if(pk.ammo[t]){ G.stash.ammo[t]=(G.stash.ammo[t]||0)+pk.ammo[t]; sent.push(pk.ammo[t]+' '+AMMO[t].name); } }
  pk.meds.forEach((n,i)=>{ if(n){ G.stash.meds[i]+=n; sent.push(n+' × '+MEDS[i].name); } });
  for(const g of pk.guns){ if(!G.guns[g]){ G.guns[g]='s'; G.mag[g]=WEAP[g].mag; sent.push(WEAP[g].name); } }
  const done=[];
  for(let i=0;i<G.missions.length;i++){
    const m=G.missions[i]; m.prog=Math.min(m.target,m.prog+raidGain(m));
    if(m.prog>=m.target){ G.cash+=m.reward; done.push(m); G.missions[i]=null; }
  }
  G.missions=G.missions.filter(Boolean); while(G.missions.length<3) G.missions.push(genMission());
  const s=raid.stats, cash=raid.cash, guns=raid.newGuns.map(g=>WEAP[g].name);
  backToSafe();
  openModal(`<div class="m-head"><h2>Extracted</h2><div class="cash num">${money(G.cash)}</div></div>
  <div class="m-text"><p>You made it out through ${esc(s.extName||'the exfil')}.</p></div>

   <div class="row"><div class="r-main"><div class="r-name">Kills</div><div class="r-desc">${s.scavs} scavs · ${s.dogs} dogs</div></div><div class="reward">${s.kills}</div></div>
   ${guns.length?`<div class="row"><div class="r-main"><div class="r-name">New weapons kept</div><div class="r-desc">${guns.map(esc).join(', ')}</div></div></div>`:''}
   ${sent.length?`<div class="row"><div class="r-main"><div class="r-name">Backpack sent to your stash</div><div class="r-desc">${sent.map(esc).join(', ')}</div></div></div>`:''}

  <div class="m-actions"><button class="primary" data-close>Back to the safehouse</button></div>`);
}
function die(){
  if(!raid||raid.over) return;
  raid.over=true;
  for(const g of raid.newGuns){ delete G.guns[g]; G.mag[g]=0; }
  if(!carriedGuns().length){ G.guns.glock='p'; G.mag.glock=17; }

/* ---- Roundhouse kick ---- */
const KICK_DUR=0.42;
let hitStop=0, shake=0;
function startKick(){
  if(modalOpen||P.kickCd>0||P.kickT>0||P.healT>0) return;
  P.kickT=KICK_DUR; P.kickCd=0.8; P.kickAng=P.angle; P.kickHit=new Set();
}
function kickCheck(){
  const list=scene==='raid'&&raid?raid.enemies:dummies;
  for(const e of list.slice()){
    if(P.kickHit.has(e)) continue;
    if(hyp(e.x-P.x,e.y-P.y)<=P.r+e.r+24){ P.kickHit.add(e); kickHit(e); if(scene==='raid'&&(!raid||raid.over)) return; }
  }
}
function kickHit(e){
  const dx=e.x-P.x, dy=e.y-P.y, d=hyp(dx,dy)||1, ux=dx/d, uy=dy/d;
  const cx=P.x+ux*(P.r+6), cy=P.y+uy*(P.r+6);
  fx.push({k:'ring',x:cx,y:cy,t:0.28,max:0.28});
  for(let i=0;i<8;i++){ const a=Math.atan2(uy,ux)+rr(-0.9,0.9), v=rr(120,260); fx.push({k:'spark',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0.22,max:0.22}); }
  hitStop=0.075; shake=Math.max(shake,9);
  if(!e.type){ e.hitT=0.15; e.wob=1; e.wobA=Math.atan2(uy,ux); pops.push({x:e.x,y:e.y-22,text:'KICK!',t:0.7,col:'#e3a63a'}); return; }
  const dog=e.type==='dog';
  e.hitT=0.18; if(e.type==='scav') e.alert=4;
  pops.push({x:e.x,y:e.y-24,text:'KICK!',t:0.8,col:'#e3a63a'});
  const v=dog?500:420;
  e.kb={t:0,phase:0,p:0,times:dog?[0.26,0.3,0.32,0.06,0.26]:[0.28,0.34,0.38,0.32,0.5],vx:ux*v,vy:uy*v,dir:Math.atan2(uy,ux),dust:0,landed:false};
}
function updateKnock(e,dt){
  const k=e.kb; k.t+=dt;
  let ph=0, acc=0; while(ph<k.times.length && k.t>acc+k.times[ph]){ acc+=k.times[ph]; ph++; }
  if(ph>=k.times.length){ e.kb=null; e.alert=4; e.fireCd=Math.max(e.fireCd||0,0.35); e.biteCd=Math.max(e.biteCd||0,0.3); return; }
  if(e.dying && ph>=3){ killEnemy(e); return; }
  k.phase=ph; k.p=(k.t-acc)/k.times[ph];
  if(ph===1 && !k.landed){ k.landed=true; shake=Math.max(shake,4); for(let i=0;i<7;i++) fx.push({k:'dust',x:e.x,y:e.y,vx:rr(-70,70),vy:rr(-70,70),t:0.45,max:0.45}); }
  if(ph===1){ const f=Math.exp(-2.2*dt); k.vx*=f; k.vy*=f; }
  else if(ph===2){ const f=Math.exp(-7*dt); k.vx*=f; k.vy*=f; k.dust-=dt; if(k.dust<=0){ k.dust=0.035; fx.push({k:'dust',x:e.x-Math.cos(k.dir)*e.r,y:e.y-Math.sin(k.dir)*e.r,vx:rr(-25,25)-k.vx*0.08,vy:rr(-25,25)-k.vy*0.08,t:0.4,max:0.4}); } }
  else if(ph>=3){ k.vx=0; k.vy=0; if(ph===4) e.face=Math.atan2(P.y-e.y,P.x-e.x); }
  const bx=e.x+k.vx*dt, by=e.y+k.vy*dt; e.x=bx; e.y=by;
  resolve(e);
  if(Math.abs(e.x-bx)>0.3){ k.vx*=-0.35; }
  if(Math.abs(e.y-by)>0.3){ k.vy*=-0.35; }
}

function tryFire(){

  if(P.kickT>0) return;
  if(P.healT>0){ toastOnce('healshoot','Can\'t shoot while using meds.','',2500); return; }

  if(!w.auto && !trigFresh) return;
  trigFresh=false;

    else if(!have){ pk.guns.push(L.gun); toast(WEAP[L.gun].name+' strapped to your backpack. It goes to your stash if you extract.','good'); }
    else { const v=Math.round(WEAP[L.gun].price*0.3/10)*10; raid.cash+=v; toast('Spare '+WEAP[L.gun].name+' to sell: +'+money(v),'good'); }

function enemyShoot(e){
  const a=e.face+rr(-0.13,0.13), sx=e.x+Math.cos(e.face)*22, sy=e.y+Math.sin(e.face)*22;
  bullets.push({x:sx,y:sy,px:sx,py:sy,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg:8,owner:'e',life:1.1});
  fx.push({k:'flash',x:sx,y:sy,t:0.05,max:0.05,a:e.face});
}
function wander(e,dt,spd){
  e.wpT-=dt;
  if(!e.wp || e.wpT<=0 || hyp(e.wp.x-e.x,e.wp.y-e.y)<16){ e.wp={x:clamp(e.x+rr(-320,320),60,WORLD.w-60),y:clamp(e.y+rr(-320,320),60,WORLD.h-60)}; e.wpT=rr(4,9); }
  const r=F('chaseStep',e.x,e.y,e.wp.x,e.wp.y,spd,dt);
  if(r){ const dx=r.x-e.x, dy=r.y-e.y; if(Math.abs(dx)+Math.abs(dy)>0.01) e.face=Math.atan2(dy,dx); e.x=r.x; e.y=r.y; }
}
function updateEnemies(dt){
  for(const e of raid.enemies.slice()){
    if(!raid||raid.over) return;
    e.hitT=Math.max(0,e.hitT-dt);
    if(e.kb){ updateKnock(e,dt); continue; }
    const d=F('distance',e.x,e.y,P.x,P.y);
    const sees=d!==null && d<(e.type==='dog'?560:520);
    if(e.type==='scav'){
      if(sees) e.alert=4; else e.alert=Math.max(0,e.alert-dt);
      if(e.alert>0 && d!==null){
        e.face=Math.atan2(P.y-e.y,P.x-e.x);
        let tx=P.x, ty=P.y, spd=105;
        if(d<300){ e.strafeT-=dt; if(e.strafeT<=0){ e.strafeDir=-e.strafeDir; e.strafeT=rr(1,2.2); } const s=e.face+PI/2; tx=e.x+Math.cos(s)*e.strafeDir*80; ty=e.y+Math.sin(s)*e.strafeDir*80; spd=80; }
        const r=F('chaseStep',e.x,e.y,tx,ty,spd,dt); if(r){ e.x=r.x; e.y=r.y; }
        e.fireCd-=dt;
        if(e.fireCd<=0 && d<520){ enemyShoot(e); e.burst--; if(e.burst>0) e.fireCd=0.14; else { e.burst=2+Math.floor(Math.random()*3); e.fireCd=rr(0.8,1.4); } }
      } else wander(e,dt,55);
    } else {
      e.biteCd-=dt;
      if(sees){
        e.face=Math.atan2(P.y-e.y,P.x-e.x);
        const r=F('chaseStep',e.x,e.y,P.x,P.y,300,dt); if(r){ e.x=r.x; e.y=r.y; }
        if(Math.abs(e.x-P.x)<60&&Math.abs(e.y-P.y)<60){ const hit=F('circlesOverlap',e.x,e.y,e.r+4,P.x,P.y,P.r); if(hit===true && e.biteCd<=0){ e.biteCd=0.75; hurtPlayer(10); if(!raid) return; } }
      } else wander(e,dt,45);
    }
    resolve(e);
  }
}
function targetsList(){ return scene==='raid'?raid.enemies:dummies; }
function hitTargets(x,y,r,dmg){
  for(const e of targetsList()){
    if(Math.abs(x-e.x)>e.r+r+40||Math.abs(y-e.y)>e.r+r+40) continue;
    const h=F('circlesOverlap',x,y,r,e.x,e.y,e.r);
    if(h===true){ damageTarget(e,dmg); return true; }
  }
  return false;
}
function updateBullets(dt,frozen){
  const W=scene==='raid'?WORLD:SAFE;
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(!b) continue;
    if(frozen && b.owner==='e') continue;
    b.px=b.x; b.py=b.y;
    const steps=Math.max(1,Math.ceil(hyp(b.vx,b.vy)*dt/9));
    let dead=false;
    for(let s=0;s<steps&&!dead;s++){
      b.x+=b.vx*dt/steps; b.y+=b.vy*dt/steps;
      if(hitsWall(b.x,b.y)){ fx.push({k:'spark',x:b.x,y:b.y,t:0.15,max:0.15}); dead=true; break; }
      if(b.owner==='p'){ if(hitTargets(b.x,b.y,3,b.dmg)) dead=true; }
      else if(Math.abs(b.x-P.x)<40&&Math.abs(b.y-P.y)<40){ const h=F('circlesOverlap',b.x,b.y,3,P.x,P.y,P.r); if(h===true){ hurtPlayer(b.dmg); dead=true; } }
      if(scene!=='raid' && b.owner==='e') return;
    }
    b.life-=dt;
    if(dead||b.life<=0||b.x<-50||b.y<-50||b.x>W.w+50||b.y>W.h+50) bullets.splice(i,1);
  }
  for(let i=flames.length-1;i>=0;i--){
    const f=flames[i];
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=0.97; f.vy*=0.97; f.life-=dt; f.r=4+(1-f.life/f.max)*14;
    let dead=f.life<=0||hitsWall(f.x,f.y);
    if(!dead && hitTargets(f.x,f.y,f.r,f.dmg)) dead=true;
    if(dead) flames.splice(i,1);
  }
}

  else if(k==='m') toggleMap();

    if(di<o.rad && (!best||di<best.di)){ const d=F('distance',P.x,P.y,o.x,o.y); best={o,di,ok:d!==null&&d<o.rad}; }

function drawMap(){
  const c=mctx, S=mapSize;
  c.fillStyle='#cfc29b'; c.fillRect(0,0,S,S);
  c.strokeStyle='rgba(90,70,40,0.12)'; c.lineWidth=1;

    c.fillText('This map is blank.',S/2,S/2-10); c.font='14px Barlow,sans-serif'; c.fillText('Finish toMinimap() in </> to draw it.',S/2,S/2+14);

  }

  c.lineCap='round'; c.lineJoin='round';
  for(const r of ROADS){ c.beginPath(); for(let i=0;i<r.pts.length;i++){ const p=M(r.pts[i][0],r.pts[i][1]); if(!p) return; i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); } c.strokeStyle=r.paved?'#7a6a4a':'#9a8460'; c.lineWidth=Math.max(2,r.w*S/WORLD.w); c.stroke(); }
  c.font='600 11px "Barlow Condensed",sans-serif'; c.textAlign='center';
  for(const h of HOUSES){ const a=M(h.x,h.y), b=M(h.x+h.w,h.y+h.h); if(!a||!b) return; c.fillStyle='#5b3f2a'; c.fillRect(a.x,a.y,b.x-a.x,b.y-a.y); c.fillStyle='#3e2e1c'; c.fillText(h.name.toUpperCase(),(a.x+b.x)/2,a.y-4); }
  if(scene==='raid'){
    const e=raid.ext, p=M(e.x,e.y);
    if(p){ c.strokeStyle='#2f7a2a'; c.lineWidth=2.5; c.beginPath(); c.arc(p.x,p.y,10,0,TAU); c.stroke(); c.fillStyle='rgba(47,122,42,.3)'; c.fill();
      c.fillStyle='#1f5a1c'; c.font='700 12px "Barlow Condensed",sans-serif'; c.textAlign=p.x>S-90?'right':(p.x<90?'left':'center'); c.fillText('EXFIL · '+e.name.toUpperCase(),clamp(p.x,4,S-4),p.y<24?p.y+24:p.y-14); }
    const q=M(P.x,P.y);
    if(q){ c.save(); c.translate(q.x,q.y); c.rotate(P.angle); c.fillStyle='#b8321e'; c.beginPath(); c.moveTo(9,0); c.lineTo(-6,6); c.lineTo(-3,0); c.lineTo(-6,-6); c.closePath(); c.fill(); c.restore();
      c.strokeStyle='#b8321e'; c.lineWidth=1.5; c.beginPath(); c.arc(q.x,q.y,13,0,TAU); c.stroke(); }
    note.textContent='Red arrow is you. Green circle is your exfil: '+e.name+'.';
  } else note.textContent='Your exfil shows up here once you deploy.';
}

function fmt(v){
  if(v===undefined) return 'undefined';
  if(v===null) return 'null';
  if(typeof v==='number'){ if(Number.isNaN(v)) return 'NaN'; if(!isFinite(v)) return String(v); return Number.isInteger(v)?String(v):String(+v.toFixed(3)); }
  if(typeof v==='boolean'||typeof v==='string') return typeof v==='string'?JSON.stringify(v):String(v);
  if(typeof v==='object'){ try{ return '{ '+Object.keys(v).map(k=>k+': '+fmt(v[k])).join(', ')+' }'; }catch(e){ return String(v); } }
  return String(v);
}

const MAGLOOK={glock:{w:16,h:58,c:0,s:17},ak:{w:20,h:84,c:16,s:30},m4:{w:19,h:80,c:7,s:30},hornet:{w:17,h:84,c:0,s:28},pkm:{box:true},m700:{w:18,h:34,c:0,s:5}};
let magKey='';
function drawMagHUD(inRaid){
  const cv=H.magCv, g=G.eq, w=WEAP[g], n=inRaid?G.mag[g]:w.mag, key=g+':'+n+':'+DPR;
  if(key===magKey) return; magKey=key;
  const d=DPR, c=cv.getContext('2d'); cv.width=64*d; cv.height=96*d; c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,64,96);
  const L=MAGLOOK[g], glass='rgba(235,229,210,.09)', edge='rgba(235,229,210,.6)', brass='#d1a948', tip='#b5683a';
  if(L.box){
    const bx=4,by=28,bw=56,bh=60;
    c.fillStyle=glass; c.fillRect(bx,by,bw,bh); c.strokeStyle=edge; c.lineWidth=1.5; c.strokeRect(bx,by,bw,bh);
    c.fillStyle=edge; c.fillRect(bx+bw-15,by-9,11,9);
    const cols=10, rows=10, shown=n<=0?0:Math.max(1,Math.round(n/w.mag*cols*rows));
    for(let k=0;k<cols*rows;k++){ const x=bx+4+(k%cols)*5.1, y=by+4+Math.floor(k/cols)*5.5;
      if(k<shown){ c.fillStyle=brass; c.fillRect(x,y+1.6,3,3.4); c.fillStyle=tip; c.fillRect(x+0.5,y,2,1.8); }
      else { c.fillStyle='rgba(255,255,255,.05)'; c.fillRect(x,y,3,5); } }
    return;
  }
  const rows=L.s, rh=L.h/rows, top=96-L.h-4, filled=n<=0?0:Math.max(1,Math.round(n/w.mag*rows));
  const x0=(64-L.w-L.c)/2, off=t=>L.c*t*t;
  c.beginPath();
  for(let i=0;i<=rows;i++){ const t=i/rows; i?c.lineTo(x0+off(t),top+i*rh):c.moveTo(x0+off(t),top); }
  for(let i=rows;i>=0;i--){ const t=i/rows; c.lineTo(x0+off(t)+L.w,top+i*rh); }
  c.closePath(); c.fillStyle=glass; c.fill(); c.strokeStyle=edge; c.lineWidth=1.5; c.stroke();
  for(let i=0;i<filled;i++){ const t=(i+0.5)/rows, x=x0+off(t)+2, y=top+i*rh+0.5, h=Math.max(1,rh-1);
    c.fillStyle=brass; c.fillRect(x,y,L.w-8,h); c.fillStyle=tip; c.fillRect(x+L.w-8,y,4,h); }
  const ft=Math.min(1,filled/rows); c.fillStyle='rgba(235,229,210,.45)'; c.fillRect(x0+off(ft)+2,top+filled*rh,L.w-4,2);
  c.fillStyle=edge; c.fillRect(x0+1,top-3,4,3); c.fillRect(x0+L.w-5,top-3,4,3);
}

/* ================= UPDATE ================= */
function update(dt){
  if(modalOpen) return;
  const frozen=panelOpen||mapOpen;
  G.stats.time+=dt;
  autosaveT+=dt; if(autosaveT>15){ autosaveT=0; saveAll(); }
  // player
  const dirX=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  const dirY=((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  const moving=dirX!==0||dirY!==0, want=!!keys.shift&&moving&&P.healT<=0;
  const st=F('staminaStep',P.stam,want&&!P.winded,dt);
  P.stamOk=st!==null;
  if(st!==null){ P.stam=clamp(st,-50,150); if(P.stam<=0) P.winded=true; else if(P.winded&&P.stam>=25) P.winded=false; }
  else if(keys.shift&&moving) toastOnce('sprint','Sprinting needs staminaStep(). Open </>.','',9000);
  P.sprinting=st!==null&&want&&!P.winded;
  const spd=215*(P.buffT>0?1.35:1)*(WEAP[G.eq].heavy?0.82:1)*((G.armor&&ARMOR[G.armor.cls].slow)||1)*(P.sprinting?1.55:1)*(P.healT>0?0.6:1)*(P.kickT>0?0.45:1);
  const mv=F('movePlayer',P.x,P.y,dirX,dirY,spd,dt);
  if(mv){ P.x=mv.x; P.y=mv.y; }
  resolve(P);
  const m=mouseWorld(), a=F('aimAngle',P.x,P.y,m.x,m.y);
  P.aimOk=a!==null; if(a!==null) P.angle=a;
  P.fireCd-=dt; P.flameCd-=dt; if(P.buffT>0) P.buffT-=dt;
  if(P.kickCd>0) P.kickCd-=dt;
  if(P.kickT>0){ P.kickT-=dt; const kp=1-P.kickT/KICK_DUR; if(kp>0.25&&kp<0.72) kickCheck(); if(scene==='raid'&&!raid) return; if(P.kickT<0) P.kickT=0; }
  if(P.healT>0){ const step=Math.min(dt,P.healT); P.hp=Math.min(P.max,Math.max(P.hp,0)+P.healRate*step); P.healT-=dt;
    if(P.healT<=0){ P.healT=0; const md=MEDS[P.healTier]; if(md.buff) P.buffT=md.buff; pops.push({x:P.x,y:P.y-24,text:'+'+md.heal,t:0.9,col:'#86c25b'}); } }
  if(P.reloadT>0){ P.reloadT-=dt; if(P.reloadT<=0){ P.reloadT=0; finishReload(); } }
  if(mouseDown) tryFire();
  if(rightDown) tryFlame();
  if(scene==='raid'&&!frozen&&P.reloadT<=0&&P.healT<=0&&!P.sprinting) G.stats.gun[G.eq]=(G.stats.gun[G.eq]||0)+dt;
  if(scene==='raid'&&!frozen){ updateEnemies(dt); if(scene!=='raid') return; }
  updateBullets(dt,frozen);
  if(scene==='raid'&&raid&&!raid.over){
    // loot
    for(let i=raid.loot.length-1;i>=0;i--){ const L=raid.loot[i]; if(Math.abs(L.x-P.x)>60||Math.abs(L.y-P.y)>60) continue; const d=F('distance',P.x,P.y,L.x,L.y); if(d!==null&&d<30){ raid.loot.splice(i,1); pickup(L); } }
    // visits
    const h=inHouse(P.x,P.y,0); if(h){ const idx=HOUSES.indexOf(h); if(!raid.stats.visited.has(idx)){ raid.stats.visited.add(idx); if(G.missions.some(mm=>mm.type==='visit'&&mm.house===idx)) toast('Searched the '+h.name+'. Now get out alive.','good'); } }
    // extract
    const e=raid.ext, d=F('distance',P.x,P.y,e.x,e.y);
    if(d!==null&&d<e.r){ raid.extT+=dt; if(raid.extT>=5){ raid.stats.extName=e.name; doExtract(); return; } } else raid.extT=0;
  }
  if(scene==='safe') for(const d of dummies){ d.hitT=Math.max(0,d.hitT-dt); if(d.wob) d.wob*=Math.exp(-3.5*dt); }
  // fx
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t-=dt; if(f.vx){ f.x+=f.vx*dt; f.y+=f.vy*dt; } if(f.t<=0) fx.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t-=dt; p.y-=28*dt; if(p.t<=0) pops.splice(i,1); }
  // camera
  const cx=F('smoothCamera',cam.x,P.x,7,dt), cy=F('smoothCamera',cam.y,P.y,7,dt);
  if(cx!==null&&cy!==null&&Math.abs(cx-P.x)<1500&&Math.abs(cy-P.y)<1500){ cam.x=cx; cam.y=cy; } else { cam.x=P.x; cam.y=P.y; }
}

    c.strokeStyle=hit?'#ffffff':'#c9a77f'; c.lineWidth=4;

function drawKnocked(c,e){

  else if(ph===1){ roll=0.6+p*(TAU-0.6); h=Math.abs(Math.sin(Math.PI*p))*4; }
  else if(ph===4){ const q=1-Math.pow(1-p,2); lie=1-q; h=Math.sin(Math.PI*p)*(dog?7:3); }
  const sc=1+h/45, wob=ph===3?Math.sin(p*30)*0.04:0;
  c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(e.x+3,e.y+4,(dog?16:e.r*1.3)*(1-h/60),(dog?8:e.r*0.9)*(1-h/60),k.dir,0,TAU); c.fill();

    c.save(); c.globalAlpha=Math.min(1,lie*1.4); c.translate(e.x,e.y-h); c.rotate(k.dir+wob+(ph===0?p*0.8:0));
    const cr=Math.cos(roll); c.scale(sc,sc*Math.max(0.22,Math.abs(cr)));

  for(let x=0;x<SAFE.w;x+=48){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,SAFE.h); c.stroke(); }
  for(let y=0;y<SAFE.h;y+=48){ c.beginPath(); c.moveTo(0,y); c.lineTo(SAFE.w,y); c.stroke(); }
  c.fillStyle='#2b2e27'; c.fillRect(836,24,340,712);
  c.strokeStyle='rgba(227,166,58,.25)'; c.setLineDash([10,10]); for(const y of [190,380,560]){ c.beginPath(); c.moveTo(850,y); c.lineTo(1170,y); c.stroke(); } c.setLineDash([]);
  c.fillStyle='#4a3a2b'; c.fillRect(360,330,280,150); c.strokeStyle='#5b4734'; c.lineWidth=4; c.strokeRect(372,342,256,126);
  for(const [lx,ly,lr] of [[215,110,240],[520,330,280],[1000,380,260],[500,690,160]]){ const g=c.createRadialGradient(lx,ly,0,lx,ly,lr); g.addColorStop(0,'rgba(255,200,120,.16)'); g.addColorStop(1,'rgba(255,200,120,0)'); c.fillStyle=g; c.fillRect(lx-lr,ly-lr,lr*2,lr*2); }
  // shelves behind trader
  c.fillStyle='#3d3226'; c.fillRect(40,30,330,40); c.fillStyle='#7a6440'; for(let i=0;i<9;i++) c.fillRect(50+i*35,36,24,24);
  drawSoldier(c,215,128,PI/2,15,'#5d6b4a','#4a5a3a',0,false);
  c.fillStyle='#5b4630'; c.fillRect(90,170,250,30); c.fillStyle='rgba(255,230,190,.15)'; c.fillRect(90,170,250,3);
  c.fillStyle='#a88a3a'; c.fillRect(130,176,22,14); c.fillStyle='#e8e2d0'; c.fillRect(270,176,18,16); c.fillStyle='#c33a2a'; c.fillRect(277,178,4,12); c.fillRect(273,182,12,4);
  // board
  c.fillStyle='#6d5034'; c.fillRect(440,26,160,46); c.fillStyle='#e6dcc0'; c.fillRect(452,32,36,30); c.fillRect(498,34,40,28); c.fillRect(548,31,40,32); c.fillStyle='#b8321e'; for(const x of [470,518,568]){ circ(c,x,34,2.5); c.fill(); }
  // crates
  for(const r of SAFE_WALLS.slice(7)){ c.fillStyle='#5a4a32'; c.fillRect(r.x,r.y,r.w,r.h); c.strokeStyle='#3e3222'; c.lineWidth=2; c.strokeRect(r.x+3,r.y+3,r.w-6,r.h-6); c.beginPath(); c.moveTo(r.x+3,r.y+3); c.lineTo(r.x+r.w-3,r.y+r.h-3); c.moveTo(r.x+r.w-3,r.y+3); c.lineTo(r.x+3,r.y+r.h-3); c.stroke(); }
  for(const d0 of dummies){ const w=(d0.wob||0)*Math.sin(t*28)*7, d={x:d0.x+Math.cos(d0.wobA||0)*w,y:d0.y+Math.sin(d0.wobA||0)*w,r:d0.r,hitT:d0.hitT}; c.fillStyle='rgba(0,0,0,.3)'; circ(c,d0.x+3,d0.y+4,d.r); c.fill(); c.fillStyle=d.hitT>0?'#ffffff':'#c8b48a'; circ(c,d.x,d.y,d.r); c.fill(); c.strokeStyle='#b8321e'; c.lineWidth=3; circ(c,d.x,d.y,d.r*0.6); c.stroke(); c.fillStyle='#b8321e'; circ(c,d.x,d.y,3); c.fill(); }
  drawPlayer(c); drawLaser(c);
  drawFX(c);
  drawWalls(c,SAFE_WALLS.slice(0,7).filter(r=>r!==SAFE_WALLS[6]));
  c.fillStyle='#3f6b3a'; c.fillRect(455,736,90,24); c.fillStyle='rgba(134,194,91,.5)'; c.fillRect(455,736,90,3);
  label(c,'OLD PETE · TRADER',215,96,'#e3a63a'); label(c,'JOBS BOARD',520,90); label(c,'RANGE · FREE PRACTICE',1006,60); label(c,'DEPLOY ›',500,726,'#86c25b'); label(c,'STASH',120,548);
}
function drawRaid(c,t){
  const cx0=viewCX();
  const x0=cam.x-cx0-60, x1=cam.x+(VW-cx0)+60, y0=cam.y-VH/2-60, y1=cam.y+VH/2+60;
  const inV=(x,y,m)=>x>x0-m&&x<x1+m&&y>y0-m&&y<y1+m;
  c.drawImage(groundCanvas,0,0,WORLD.w,WORLD.h);
  // exfil zone
  const e=raid.ext;
  if(inV(e.x,e.y,e.r+40)){
    c.fillStyle='rgba(134,194,91,.13)'; circ(c,e.x,e.y,e.r); c.fill();
    c.save(); c.translate(e.x,e.y); c.rotate(t*0.4); c.setLineDash([14,10]); c.strokeStyle='rgba(134,194,91,.85)'; c.lineWidth=3; circ(c,0,0,e.r); c.stroke(); c.restore(); c.setLineDash([]);
    const pr=raid.extT/5; if(pr>0){ c.strokeStyle='#86c25b'; c.lineWidth=6; c.beginPath(); c.arc(e.x,e.y,e.r+8,-PI/2,-PI/2+pr*TAU); c.stroke(); }
    label(c,'EXFIL · '+e.name.toUpperCase(),e.x,e.y-e.r-10,'#9fd877');
  }
  for(const L of raid.loot) if(inV(L.x,L.y,20)) drawLoot(c,L,t);
  for(const en of raid.enemies){ if(!inV(en.x,en.y,30)) continue; if(en.kb) drawKnocked(c,en); else if(en.type==='dog') drawDog(c,en); else drawSoldier(c,en.x,en.y,en.face,en.r,'#8a4a36','#5a2f22',24,en.hitT>0); drawHpBar(c,en); }
  drawPlayer(c); drawLaser(c);
  drawFX(c);
  drawWalls(c,RAID_WALLS);
  for(const tr of TREES){
    if(!inV(tr.x,tr.y,tr.r)) continue;
    const under=hyp(P.x-tr.x,P.y-tr.y)<tr.r+8;
    c.globalAlpha=under?0.35:0.94;
    c.fillStyle=tr.c1; circ(c,tr.x,tr.y,tr.r); c.fill();
    if(tr.pine){ c.strokeStyle='rgba(0,0,0,.18)'; c.lineWidth=2; for(let k=0;k<6;k++){ const a=k*TAU/6; c.beginPath(); c.moveTo(tr.x,tr.y); c.lineTo(tr.x+Math.cos(a)*tr.r*0.9,tr.y+Math.sin(a)*tr.r*0.9); c.stroke(); } }
    c.fillStyle=tr.c2; circ(c,tr.x-tr.r*0.25,tr.y-tr.r*0.25,tr.r*0.55); c.fill();
  }
  c.globalAlpha=1;
}
function render(){
  const c=ctx, t=performance.now()/1000;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle=scene==='raid'?'#16200f':'#0b0e09'; c.fillRect(0,0,VW,VH);
  const sx=shake?rr(-shake,shake)*0.5:0, sy=shake?rr(-shake,shake)*0.5:0;
  c.save(); c.translate(Math.round(viewCX()-cam.x+sx),Math.round(VH/2-cam.y+sy));
  if(scene==='raid'&&raid) drawRaid(c,t); else drawSafe(c,t);
  c.restore();
  c.fillStyle=vignette; c.fillRect(0,0,VW,VH);
  if(!P.aimOk && !modalOpen){ c.strokeStyle='rgba(235,229,210,.5)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(mouse.x-6,mouse.y); c.lineTo(mouse.x+6,mouse.y); c.moveTo(mouse.x,mouse.y-6); c.lineTo(mouse.x,mouse.y+6); c.stroke(); }
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  if(hitStop>0) hitStop-=dt; else update(dt);
  shake=Math.max(0,shake-dt*45);
  render();
  updateHUD();
  if(mapOpen) drawMap();
  requestAnimationFrame(frame);
}
loadAll();
buildGround();
resetDummies();
resize();
updateBadge();
backToSafe();
requestAnimationFrame(frame);
if(!introSeen) openIntro();
canvas.focus({preventScroll:true});
</script></body></html>
